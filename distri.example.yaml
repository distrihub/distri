# distri.yaml — declarative seed config for the OSS standalone server.
#
# Copy this to `distri.yaml` in the server's working directory. It is the OSS
# equivalent of cloud workspace settings + seed data: it layers extra
# provider/model definitions on top of the built-in basics (openai,
# anthropic, gemini) without editing the distri source tree.
#
# All sections are optional.

# ── Provider/model extensions (layer 2 of the provider registry) ──────────
# Each provider lists its models grouped by capability: `completion`, `tts`,
# `stt`. A plain OpenAI-compatible endpoint needs only a config entry — no
# code. A provider whose `id` matches a built-in one overrides it.
model_providers:
  - id: azure_ai_foundry
    label: Azure AI Foundry
    keys:
      # `url_template` tells the UI to render this field as the editable
      # resource segment of the full endpoint URL.
      - { key: AZURE_AI_FOUNDRY_RESOURCE, label: Resource name, sensitive: false,
          url_template: "https://{}.openai.azure.com/openai/v1" }
      - { key: AZURE_AI_FOUNDRY_API_KEY, label: API key, sensitive: true }
    completion:
      - id: gpt-5.4
        name: GPT-5.4
        context_window: 128000
        pricing: { type: completion, input: 5.0, output: 15.0, cached_input: 2.5 }

# Instead of (or in addition to) inline `model_providers`, point at a
# directory of per-provider catalog files, or a single combined file such as
# a GitHub-release artifact. Relative paths resolve against this directory.
# A `providers/` directory here is also picked up automatically.
model_providers_path: providers

# ── Server ────────────────────────────────────────────────────────────────
# How this deployment is addressed. Every field here is overridden by the
# matching CLI flag or env var (--host / DISTRI_HOST, --port / DISTRI_PORT).
server:
  # Public base URL as it appears in agent cards. Defaults to
  # http://{host}:{port}/v1 — set it when the server sits behind a proxy.
  base_url: http://127.0.0.1:8081/v1
  host: 127.0.0.1
  port: 8081

# ── Auth ──────────────────────────────────────────────────────────────────
# OFF by default: a local server requires nothing and sets nothing up. Off
# means the check does not run — it is never "accept any token".
#
# Turned on, the API surface requires a bearer access token. There are two
# credentials and they are not interchangeable:
#
#   * the deployment secret — server-side only. It authorises minting via
#     POST /v1/token (sent as `x-api-key`, which is what the distri client
#     and `Distri::issue_token()` send) and nothing else. No route ever
#     returns it, and a browser must never hold it.
#   * an access token — short-lived, minted by a backend that knows the
#     secret and handed to the browser. The only thing /v1 accepts.
#
# The refresh_token renews the pair without re-presenting the secret, so a
# console can re-mint on expiry without ever seeing the deployment key.
#
# If auth is on and the secret is missing or too short, the server refuses
# to start rather than coming up unauthenticated.
auth:
  mode: off               # off (default) | token — DISTRI_AUTH overrides
  secret_env: DISTRI_AUTH_SECRET   # where to read the secret from
  # secret: "..."         # inline alternative; avoid in a checked-in file
  access_token_ttl: 1h
  refresh_token_ttl: 30d

# ── Custom provider endpoints ─────────────────────────────────────────────
# OpenAI-compatible endpoints this deployment talks to, by id and base URL.
# Applied on every start — the file owns the endpoint. Reference one from
# `default_model` (below) or from an agent's `[model_settings]` as
# `<id>/<model>`.
#
# An API key, if the endpoint wants one, goes in the secret store (or the
# environment) as {ID}_API_KEY — e.g. CUSTOM_LOCAL_API_KEY. Leave it unset
# for an endpoint that needs no auth: a local shim is not made safer by a
# placeholder key, and the deployment's OPENAI_API_KEY is never borrowed for
# a third-party base URL.
providers:
  - id: custom_local
    name: Local model
    base_url: http://127.0.0.1:8080/v1

# ── Default model ─────────────────────────────────────────────────────────
# In `provider/model` form. Seeded into the runtime store only when no
# default model has been set yet.
default_model: openai/gpt-4.1-mini

# ── Agent seeds ───────────────────────────────────────────────────────────
# Agent markdown files to load and register on startup, relative to the
# server's working directory.
agents:
  - file: agents/coder.md
