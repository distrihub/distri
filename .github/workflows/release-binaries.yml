name: release-binaries

# The distri CLI and distri-server for macOS and Linux, from a `v<version>` tag.
#
# Two releases come out of one build:
#   v<version>         distri-<os>-<arch>.tar.gz: <os>-<arch>/distri and
#                      <os>-<arch>/server/distri-server, what install.sh downloads
#   server-v<version>  distri-server-<version>-<plat>.tar.gz + .sha256, what
#                      `distri serve` downloads (distri-cli/src/launcher)
#
# The tag must match distri-cli's version. Started by distri-cloud's
# `canopy run release-distri` (scripts/release/distri.sh there), or by hand
# with workflow_dispatch; `publish: false` builds and uploads workflow
# artifacts only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.5.0 (must exist)'
        required: true
      publish:
        description: 'Create the GitHub releases (false: build only)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,      slug: darwin-arm64 }
          - { os: macos-14,         target: x86_64-apple-darwin,       slug: darwin-amd64 }
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  slug: linux-amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, slug: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
      - name: Tag matches distri-cli's version
        shell: bash
        run: |
          v=$(awk -F'"' '/^version/ { print $2; exit }' distri-cli/Cargo.toml)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG but distri-cli is $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: zig and cargo-zigbuild (Linux; the server script pins glibc 2.31 with them)
        if: runner.os == 'Linux'
        run: |
          pip install ziglang==0.13.0
          cargo install cargo-zigbuild --locked
      - name: Build the CLI
        shell: bash
        run: bash scripts/build-cli-release.sh ${{ matrix.target }}
      - name: Build the server
        shell: bash
        run: bash scripts/build-server-release.sh ${{ matrix.target }}
      - name: Package for install.sh
        shell: bash
        run: |
          set -euo pipefail
          SLUG=${{ matrix.slug }}
          STAGE=pkg/$SLUG
          mkdir -p "$STAGE/server"
          cp LICENSE "$STAGE/LICENSE"
          cp target/${{ matrix.target }}/release/distri "$STAGE/distri"
          cp target/${{ matrix.target }}/release/distri-server "$STAGE/server/distri-server"
          [ -f server/LICENSE ] && cp server/LICENSE "$STAGE/server/LICENSE" || true
          chmod +x "$STAGE/distri" "$STAGE/server/distri-server"
          tar -czf "release-out/distri-$SLUG.tar.gz" -C pkg "$SLUG"
          (cd release-out && (shasum -a 256 "distri-$SLUG.tar.gz" 2>/dev/null || sha256sum "distri-$SLUG.tar.gz") | awk '{print $1}' > "distri-$SLUG.tar.gz.sha256")
          "$STAGE/distri" --version
          ls -la release-out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: release-out/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version and the tag's commit
        id: v
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          ls -la out
      - name: v<version> (install.sh)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: distri ${{ env.TAG }}
          make_latest: true
          generate_release_notes: true
          files: |
            out/distri-darwin-*.tar.gz*
            out/distri-linux-*.tar.gz*
      - name: server-v<version> (distri serve)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-v${{ steps.v.outputs.version }}
          target_commitish: ${{ steps.v.outputs.sha }}
          name: distri-server ${{ steps.v.outputs.version }}
          make_latest: false
          files: |
            out/distri-server-*.tar.gz
            out/distri-server-*.sha256
