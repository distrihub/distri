    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8f968d">
      <text x="68" y="142">@distri/react</text><text x="292" y="142">React Native</text><text x="516" y="142">one script tag</text><text x="740" y="142">Telegram · WhatsApp</text><text x="964" y="142">your backend</text>
      <text x="740" y="160">Discord</text><text x="964" y="160">distri run</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6ea4ff">
      <text x="68" y="160">client-side tools</text><text x="292" y="160">client-side tools</text><text x="516" y="160">client-side tools</text>
    </g>
