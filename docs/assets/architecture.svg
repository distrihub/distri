<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Architecture: web, mobile, script tag, channels and API clients talk to the Distri runtime over A2A; every model call goes through the gateway to your model providers.">
