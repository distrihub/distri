[package]
name = "distri-server-cli"
version = "0.4.6"
edition = "2021"
description = "Distri OSS server binary"

[features]
default = ["sqlite"]
sqlite = ["distri-core/sqlite", "distri-server/sqlite"]
postgres = ["distri-core/postgres", "distri-server/postgres"]
sqlite_vendored = [
  "sqlite",
  "distri-core/sqlite_vendored",
  "distri-server/sqlite_vendored",
]
postgres_vendored = [
  "postgres",
  "distri-core/postgres_vendored",
  "distri-server/postgres_vendored",
]
# Compile OpenSSL rather than link the host's.
#
# Needed only when CROSS-compiling: pkg-config will not answer for a foreign
# target, so a build from an Apple Silicon Mac for arm64 Linux stops at
# openssl-sys. openssl-sys arrives through async-mcp's reqwest, which takes the
# default native-tls stack, so it cannot be swapped for rustls from here.
#
# Sits beside sqlite_vendored, which solves the same problem for libsqlite3.
openssl_vendored = ["dep:openssl"]
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]
ui = ["distri-server/ui"]

[dependencies]
distri-core = { path = "../distri-core", version = "0.4.6", default-features = false }
# Only ever pulled in by `openssl_vendored`. See the feature above.
openssl = { version = "0.10", optional = true, features = ["vendored"] }
distri-types = { path = "../../distri-types", version = "0.4.6" }
distri-auth = { path = "../distri-auth", version = "0.4.6" }
distri-filesystem = { path = "../distri-filesystem", version = "0.4.6" }
distri-server = { path = "../distri-server", version = "0.4.6", default-features = false }
dotenv = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = { workspace = true }
serde = { workspace = true }
tracing = "0.1"
tracing-subscriber = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
regex = "1.5"
toml = "0.9.5"
dirs = "5.0"
serde_yaml = "0.9"
utoipa = { workspace = true }

# Optional OTEL dependencies (enabled via `otel` feature)
opentelemetry = { version = "0.28.0", optional = true }
opentelemetry_sdk = { version = "0.28.0", optional = true }
opentelemetry-otlp = { version = "0.28.0", features = [
  "grpc-tonic",
], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[[bin]]
name = "distri-server"
path = "src/main.rs"
